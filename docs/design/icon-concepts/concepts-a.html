<!doctype html>
<html><head><meta charset="utf-8"><title>Sideplay icon A variants</title>
<style>
  body { margin: 0; background: #0b0d12; font-family: -apple-system, Helvetica, Arial, sans-serif; color: #e8e8ee; }
  .sheet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; padding: 32px; width: 1856px; }
  .concept h2 { font-size: 28px; margin: 0 0 6px; }
  .concept p { margin: 0 0 18px; color: #a9abb8; font-size: 18px; }
  .row { display: flex; gap: 24px; align-items: center; }
  .banner { width: 384px; height: 216px; border-radius: 10px; overflow: hidden; }
  .icon { width: 160px; height: 160px; }
  .small { width: 48px; height: 48px; }
</style></head>
<body><div class="sheet">

<!-- A1: outlined phone -->
<div class="concept">
  <h2>A1 · Outlined phone</h2>
  <p>Phone outline with a lit screen and a notch, then the play triangle.</p>
  <div class="row">
    <svg class="banner" viewBox="0 0 320 180"><rect width="320" height="180" fill="#1e1b4b"/>
      <rect x="30" y="52" width="38" height="76" rx="9" fill="none" stroke="#ff6b4a" stroke-width="5"/>
      <rect x="37" y="60" width="24" height="60" rx="3" fill="#ff6b4a" opacity="0.35"/>
      <rect x="43" y="56" width="12" height="3" rx="1.5" fill="#ff6b4a"/>
      <path d="M82 66 L114 90 L82 114 Z" fill="#ffd2c7" stroke="#ffd2c7" stroke-width="6" stroke-linejoin="round"/>
      <text x="132" y="104" font-family="Helvetica, Arial" font-weight="700" font-size="40" fill="#ffffff">Sideplay</text></svg>
  </div>
  <div class="row" style="margin-top:18px">
    <svg class="icon" viewBox="0 0 108 108"><rect width="108" height="108" rx="24" fill="#1e1b4b"/>
      <rect x="22" y="28" width="28" height="52" rx="7" fill="none" stroke="#ff6b4a" stroke-width="4"/>
      <rect x="27" y="34" width="18" height="40" rx="2" fill="#ff6b4a" opacity="0.35"/>
      <rect x="31" y="31" width="10" height="2.5" rx="1.25" fill="#ff6b4a"/>
      <path d="M60 37 L84 54 L60 71 Z" fill="#ffd2c7" stroke="#ffd2c7" stroke-width="5" stroke-linejoin="round"/></svg>
    <svg class="small" viewBox="0 0 108 108"><rect width="108" height="108" rx="24" fill="#1e1b4b"/>
      <rect x="22" y="28" width="28" height="52" rx="7" fill="none" stroke="#ff6b4a" stroke-width="5"/>
      <rect x="27" y="34" width="18" height="40" rx="2" fill="#ff6b4a" opacity="0.35"/>
      <path d="M60 37 L84 54 L60 71 Z" fill="#ffd2c7" stroke="#ffd2c7" stroke-width="5" stroke-linejoin="round"/></svg>
  </div>
</div>

<!-- A2: solid phone -->
<div class="concept">
  <h2>A2 · Solid phone</h2>
  <p>Solid phone with a Dynamic Island pill and a home bar, then the play triangle.</p>
  <div class="row">
    <svg class="banner" viewBox="0 0 320 180"><rect width="320" height="180" fill="#1e1b4b"/>
      <rect x="30" y="52" width="38" height="76" rx="9" fill="#ff6b4a"/>
      <rect x="42" y="58" width="14" height="5" rx="2.5" fill="#1e1b4b"/>
      <rect x="41" y="119" width="16" height="3" rx="1.5" fill="#1e1b4b" opacity="0.6"/>
      <path d="M82 66 L114 90 L82 114 Z" fill="#ffd2c7" stroke="#ffd2c7" stroke-width="6" stroke-linejoin="round"/>
      <text x="132" y="104" font-family="Helvetica, Arial" font-weight="700" font-size="40" fill="#ffffff">Sideplay</text></svg>
  </div>
  <div class="row" style="margin-top:18px">
    <svg class="icon" viewBox="0 0 108 108"><rect width="108" height="108" rx="24" fill="#1e1b4b"/>
      <rect x="22" y="28" width="28" height="52" rx="7" fill="#ff6b4a"/>
      <rect x="31" y="32" width="10" height="4" rx="2" fill="#1e1b4b"/>
      <rect x="30" y="73" width="12" height="2.5" rx="1.25" fill="#1e1b4b" opacity="0.6"/>
      <path d="M60 37 L84 54 L60 71 Z" fill="#ffd2c7" stroke="#ffd2c7" stroke-width="5" stroke-linejoin="round"/></svg>
    <svg class="small" viewBox="0 0 108 108"><rect width="108" height="108" rx="24" fill="#1e1b4b"/>
      <rect x="22" y="28" width="28" height="52" rx="7" fill="#ff6b4a"/>
      <rect x="31" y="32" width="10" height="4" rx="2" fill="#1e1b4b"/>
      <path d="M60 37 L84 54 L60 71 Z" fill="#ffd2c7" stroke="#ffd2c7" stroke-width="5" stroke-linejoin="round"/></svg>
  </div>
</div>

<!-- A3: tilted phone -->
<div class="concept">
  <h2>A3 · Tilted phone</h2>
  <p>Solid phone tilted toward the play triangle, as if sliding sideways onto the TV.</p>
  <div class="row">
    <svg class="banner" viewBox="0 0 320 180"><rect width="320" height="180" fill="#1e1b4b"/>
      <g transform="rotate(-12 49 90)">
        <rect x="30" y="52" width="38" height="76" rx="9" fill="#ff6b4a"/>
        <rect x="42" y="58" width="14" height="5" rx="2.5" fill="#1e1b4b"/>
      </g>
      <path d="M86 66 L118 90 L86 114 Z" fill="#ffd2c7" stroke="#ffd2c7" stroke-width="6" stroke-linejoin="round"/>
      <text x="136" y="104" font-family="Helvetica, Arial" font-weight="700" font-size="40" fill="#ffffff">Sideplay</text></svg>
  </div>
  <div class="row" style="margin-top:18px">
    <svg class="icon" viewBox="0 0 108 108"><rect width="108" height="108" rx="24" fill="#1e1b4b"/>
      <g transform="rotate(-12 36 54)">
        <rect x="22" y="28" width="28" height="52" rx="7" fill="#ff6b4a"/>
        <rect x="31" y="32" width="10" height="4" rx="2" fill="#1e1b4b"/>
      </g>
      <path d="M61 37 L85 54 L61 71 Z" fill="#ffd2c7" stroke="#ffd2c7" stroke-width="5" stroke-linejoin="round"/></svg>
    <svg class="small" viewBox="0 0 108 108"><rect width="108" height="108" rx="24" fill="#1e1b4b"/>
      <g transform="rotate(-12 36 54)">
        <rect x="22" y="28" width="28" height="52" rx="7" fill="#ff6b4a"/>
        <rect x="31" y="32" width="10" height="4" rx="2" fill="#1e1b4b"/>
      </g>
      <path d="M61 37 L85 54 L61 71 Z" fill="#ffd2c7" stroke="#ffd2c7" stroke-width="5" stroke-linejoin="round"/></svg>
  </div>
</div>

</div></body></html>
